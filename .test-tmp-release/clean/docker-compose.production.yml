# Standalone single-host production stack.
# The host TLS proxy must forward HTTPS traffic to 127.0.0.1:8080.
x-api-build: &api-build
  context: .
  dockerfile: Dockerfile.api

x-api-image: &api-image novaq-api:${NOVAQ_RELEASE_ID:?Set the immutable release identifier}

x-db-build: &db-build
  context: .
  dockerfile: Dockerfile.db

x-db-image: &db-image novaq-db:${NOVAQ_RELEASE_ID:?Set the immutable release identifier}

x-logging: &production-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-database-environment: &database-environment
  POSTGRES_USER: ${POSTGRES_USER:?Set the database user}
  POSTGRES_DB: ${POSTGRES_DB:?Set the database name}
  POSTGRES_PASSWORD_FILE: /run/secrets/db_password
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}

services:
  db:
    image: *db-image
    build: *db-build
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set the database user}
      POSTGRES_DB: ${POSTGRES_DB:?Set the database name}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging: *production-logging
    networks:
      novaq_private:
        ipv4_address: 172.30.0.30

  migrate:
    image: *api-image
    build: *api-build
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m backend.operations.migration_status"]
    environment: *database-environment
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging: *production-logging
    networks: [novaq_private]

  bootstrap-admin:
    image: *api-image
    build: *api-build
    restart: "no"
    command:
      - python
      - -m
      - backend.db.seed
      - --email
      - ${ADMIN_EMAIL:?Set the bootstrap administrator email}
      - --password-file
      - /run/secrets/admin_password
      - --role
      - admin
    environment:
      <<: *database-environment
      NOVAQ_ENV: production
    secrets:
      - db_password
      - admin_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging: *production-logging
    networks: [novaq_private]

  api:
    image: *api-image
    build: *api-build
    restart: unless-stopped
    environment:
      <<: *database-environment
      NOVAQ_ENV: production
      SECURE_COOKIES: "1"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the public HTTPS origin}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set the public HTTPS app origin}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      EMAIL_DELIVERY_MODE: smtp
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Set the SMTP from address}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      GOOGLE_SIGN_IN_ENABLED: ${GOOGLE_SIGN_IN_ENABLED:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VERIFICATION_TTL_MINUTES: ${VERIFICATION_TTL_MINUTES:-60}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      GOOGLE_NONCE_TTL_MINUTES: ${GOOGLE_NONCE_TTL_MINUTES:-5}
      AUTH_TOKEN_COOLDOWN_SECONDS: ${AUTH_TOKEN_COOLDOWN_SECONDS:-60}
      AUTH_TOKEN_HOURLY_LIMIT: ${AUTH_TOKEN_HOURLY_LIMIT:-5}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      XLSX_MAX_UNCOMPRESSED_BYTES: ${XLSX_MAX_UNCOMPRESSED_BYTES:-52428800}
      XLSX_MAX_ZIP_MEMBERS: ${XLSX_MAX_ZIP_MEMBERS:-1000}
      XLSX_MAX_COMPRESSION_RATIO: ${XLSX_MAX_COMPRESSION_RATIO:-100}
      XLSX_MAX_WORKSHEETS: ${XLSX_MAX_WORKSHEETS:-20}
      UPLOAD_MAX_ROWS: ${UPLOAD_MAX_ROWS:-100000}
      UPLOAD_MAX_COLUMNS: ${UPLOAD_MAX_COLUMNS:-100}
      UPLOAD_MAX_CELL_CHARS: ${UPLOAD_MAX_CELL_CHARS:-32768}
      UPLOAD_MAX_DATAFRAME_BYTES: ${UPLOAD_MAX_DATAFRAME_BYTES:-104857600}
      RESULT_JSONB_MAX_BYTES: ${RESULT_JSONB_MAX_BYTES:-524288}
      API_WORKERS: ${API_WORKERS:-1}
      API_LIMIT_CONCURRENCY: ${API_LIMIT_CONCURRENCY:-32}
      API_GRACEFUL_SHUTDOWN_SECONDS: ${API_GRACEFUL_SHUTDOWN_SECONDS:-30}
      FORWARDED_ALLOW_IPS: 172.30.0.10
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-10}
      RATE_LIMIT_REPORT: ${RATE_LIMIT_REPORT:-10}
      RATE_LIMIT_COMPUTE: ${RATE_LIMIT_COMPUTE:-30}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN:-30}
    secrets:
      - db_password
      - smtp_password
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 45s
    logging: *production-logging
    networks:
      novaq_private:
        ipv4_address: 172.30.0.20

  web:
    image: novaq-web:${NOVAQ_RELEASE_ID:?Set the immutable release identifier}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=32m
      - /var/run:noexec,nosuid,size=2m
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging: *production-logging
    networks:
      novaq_private:
        ipv4_address: 172.30.0.10

secrets:
  db_password:
    file: ${NOVAQ_DB_PASSWORD_FILE:?Set path to the root-readable database password file}
  smtp_password:
    file: ${NOVAQ_SMTP_PASSWORD_FILE:?Set path to the root-readable SMTP password file}
  admin_password:
    file: ${NOVAQ_ADMIN_PASSWORD_FILE:?Set path to the root-readable bootstrap password file}

networks:
  novaq_private:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
