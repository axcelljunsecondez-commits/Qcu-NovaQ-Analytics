name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check .

  test:
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx scipy pytest-cov
      - name: Debug - check Python and imports
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== Trying basic import ==="
          python -c "
          print('starting imports...')
          import math
          import numpy
          import pandas
          import simpy
          from queue_models import mm1, mmc
          from simulation import simulate_segment
          from optimization import optimize_segment
          from costing import compute_segment_costs
          print('ALL IMPORTS OK')
          "
      - name: Debug - run single test file
        run: |
          echo "=== Running queue_models tests ==="
          python -m pytest tests/test_queue_models.py -xvs --tb=long 2>&1
          echo "=== Exit code: $? ==="
      - name: Run all tests
        run: |
          echo "=== Running ALL tests ==="
          python -m pytest tests/ -xvs --tb=long 2>&1
          echo "=== Exit code: $? ==="
      - name: Run coverage measurement
        if: success()
        run: |
          echo "=== Running with coverage ==="
          coverage run -m pytest tests/ -x --tb=short 2>&1
          echo "=== Coverage report ==="
          coverage report --fail-under=60 --skip-covered 2>&1
      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage*

  docker-build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
