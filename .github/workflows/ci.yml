name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pip-lint-${{ runner.os }}-
      - name: Install lint tools
        run: pip install -r requirements.txt ruff mypy pip-audit
      - name: Lint with ruff
        run: ruff check .
      - name: Audit production dependencies
        run: pip-audit -r requirements-production.lock --strict
      - name: Type check with mypy
        run: mypy . --config-file=pyproject.toml

  test:
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pip-test-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pytest~=9.0" "httpx~=0.28" "hypothesis~=6.155" "scipy>=1.14.0" "pytest-cov~=7.1"
      - name: Run tests
        run: python -m pytest tests/ -x --tb=short
      - name: Run coverage measurement
        run: |
          coverage run -m pytest tests/ -x --tb=short
          coverage report --fail-under=75 --skip-covered
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage*

  docker-build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build API production image
        run: docker build --tag novaq-api:ci --file Dockerfile.api .
      - name: Build frontend production image
        run: docker build --tag novaq-web:ci --file frontend/Dockerfile .
      - name: Build database production image
        run: docker build --tag novaq-db:ci --file Dockerfile.db .
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: novaq-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: novaq-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1
      - name: Scan database image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: novaq-db:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1

  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  production-preflight:
    runs-on: ubuntu-22.04
    env:
      NOVAQ_RELEASE_ID: ci-fixture
      POSTGRES_USER: novaq_ci
      POSTGRES_DB: novaq_ci
      ADMIN_EMAIL: admin@novaq.invalid
      ALLOWED_ORIGINS: https://novaq.invalid
      PUBLIC_APP_URL: https://novaq.invalid
      SMTP_HOST: smtp.invalid
      SMTP_FROM_EMAIL: no-reply@novaq.invalid
    steps:
      - uses: actions/checkout@v4
      - name: Create restrictive fixture secret files
        env:
          NOVAQ_DB_PASSWORD_FILE: ${{ runner.temp }}/novaq-db-password
          NOVAQ_SMTP_PASSWORD_FILE: ${{ runner.temp }}/novaq-smtp-password
          NOVAQ_ADMIN_PASSWORD_FILE: ${{ runner.temp }}/novaq-admin-password
        run: |
          install -m 600 /dev/null "$NOVAQ_DB_PASSWORD_FILE"
          install -m 600 /dev/null "$NOVAQ_SMTP_PASSWORD_FILE"
          install -m 600 /dev/null "$NOVAQ_ADMIN_PASSWORD_FILE"
          printf '%s' 'ci-database-fixture-only' > "$NOVAQ_DB_PASSWORD_FILE"
          printf '%s' 'ci-smtp-fixture-only' > "$NOVAQ_SMTP_PASSWORD_FILE"
          printf '%s' 'ci-admin-fixture-only' > "$NOVAQ_ADMIN_PASSWORD_FILE"
      - name: Validate production Compose without expanding secrets
        run: docker compose -f docker-compose.production.yml config --quiet

  postgres-integration:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novaq_test
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: novaq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novaq_test -d novaq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOVAQ_TEST_DATABASE_URL: postgresql+psycopg://novaq_test:integration-only@localhost:5432/novaq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt "pytest~=9.0" "httpx~=0.28"
      - name: Postgres API regressions (isolated schemas)
        run: python -m pytest tests/test_postgres_migration_chain.py tests/test_auth_api.py tests/test_datasets_api.py tests/test_scenarios_api.py tests/test_scenario_integrity.py tests/test_reports_api.py tests/test_readiness.py -x --tb=short

  stack-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set rehearsal certificate directory
        run: echo "NOVAQ_REHEARSAL_CERT_DIR=${{ runner.temp }}/novaq-certs" >> "$GITHUB_ENV"
      - name: Start disposable Postgres, API and nginx stack
        run: docker compose -p novaq-ci -f docker-compose.integration.yml up -d --build --wait --wait-timeout 180
      - name: Exercise nginx, sessions, uploads, calculations and reports
        run: python scripts/stack_smoke.py
      - name: Create isolated HTTPS fixtures
        run: |
          docker compose -p novaq-ci -f docker-compose.integration.yml down -v
          mkdir -p "$NOVAQ_REHEARSAL_CERT_DIR"
          docker run --rm --entrypoint openssl -v "$NOVAQ_REHEARSAL_CERT_DIR:/certs" novaq-ci-api req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 -keyout /certs/localhost.key -out /certs/localhost.crt -subj /CN=localhost -addext subjectAltName=DNS:localhost -addext basicConstraints=critical,CA:TRUE
          docker compose -p novaq-ci -f docker-compose.integration.yml -f docker-compose.rehearsal.yml up -d --no-build --wait --wait-timeout 180
      - name: Verify HTTPS, Secure cookies and CORS
        run: python scripts/stack_smoke.py --https --ca-file "$NOVAQ_REHEARSAL_CERT_DIR/localhost.crt"
      - name: Back up and restore synthetic data
        run: |
          docker compose -p novaq-ci -f docker-compose.integration.yml exec -T db pg_dump -U novaq_test -d novaq_test -Fc -f /tmp/novaq-rehearsal.dump
          docker compose -p novaq-ci -f docker-compose.integration.yml exec -T db sha256sum /tmp/novaq-rehearsal.dump
          docker compose -p novaq-ci -f docker-compose.integration.yml exec -T db postgres --version
          docker compose -p novaq-ci -f docker-compose.integration.yml exec -T api python -m backend.operations.migration_status
          echo "application_commit=$GITHUB_SHA backup_created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker compose -p novaq-ci -f docker-compose.integration.yml exec -T db createdb -U novaq_test novaq_restore_test
          docker compose -p novaq-ci -f docker-compose.integration.yml exec -T db pg_restore -U novaq_test --exit-on-error --no-owner -d novaq_restore_test /tmp/novaq-rehearsal.dump
          docker compose -p novaq-ci -f docker-compose.integration.yml run --rm --no-deps --entrypoint python -v "$GITHUB_WORKSPACE:/workspace:ro" -e PYTHONDONTWRITEBYTECODE=1 api /workspace/scripts/compare_rehearsal_databases.py
          docker compose -p novaq-ci -f docker-compose.integration.yml -f docker-compose.rehearsal.yml --profile restore up -d --no-build --wait --wait-timeout 60 api-restored
          python scripts/stack_smoke.py --restored
      - name: Stack diagnostics
        if: failure()
        run: docker compose -p novaq-ci -f docker-compose.integration.yml -f docker-compose.rehearsal.yml --profile restore logs --no-color
      - name: Remove disposable stack
        if: always()
        run: docker compose -p novaq-ci -f docker-compose.integration.yml -f docker-compose.rehearsal.yml --profile restore down -v
