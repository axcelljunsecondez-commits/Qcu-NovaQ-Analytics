services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novaq
      POSTGRES_PASSWORD: novaq
      POSTGRES_DB: novaq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaq -d novaq"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://novaq:novaq@db:5432/novaq
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SECURE_COOKIES: "0"
      ALLOWED_ORIGINS: '["http://localhost"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"

  legacy:
    build: .
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"

volumes:
  pgdata:
