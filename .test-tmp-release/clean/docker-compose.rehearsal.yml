# Layer on docker-compose.integration.yml; never use with the live project.
services:
  api:
    environment:
      NOVAQ_ENV: production
      SECURE_COOKIES: "1"
      ALLOWED_ORIGINS: https://localhost:18443
      PUBLIC_APP_URL: https://localhost:18443
      EMAIL_DELIVERY_MODE: smtp
      SMTP_HOST: smtp.invalid
      SMTP_FROM_EMAIL: no-reply@localhost.invalid
      POSTGRES_USER: novaq_test
      POSTGRES_PASSWORD: integration-only
      POSTGRES_DB: novaq_test
      FORWARDED_ALLOW_IPS: 172.16.0.0/12
  tls:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    depends_on:
      web:
        condition: service_started
    ports:
      - "127.0.0.1:18443:443"
    volumes:
      - ./nginx/rehearsal-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NOVAQ_REHEARSAL_CERT_DIR:?Set the temporary test certificate directory}:/certs:ro
  api-restored:
    profiles: [restore]
    image: novaq-ci-api
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://novaq_test:integration-only@db:5432/novaq_restore_test
      NOVAQ_ENV: integration
      SECURE_COOKIES: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
      interval: 2s
      timeout: 5s
      retries: 30
