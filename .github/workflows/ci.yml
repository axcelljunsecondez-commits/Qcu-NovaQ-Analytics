name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pip-lint-${{ runner.os }}-
      - name: Install lint tools
        run: pip install ruff mypy pip-audit
      - name: Lint with ruff
        run: ruff check .
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict
      - name: Type check with mypy
        run: mypy . --config-file=pyproject.toml

  test:
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pip-test-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pytest~=9.0" "httpx~=0.28" "hypothesis~=6.155" "scipy>=1.14.0" "pytest-cov~=7.1"
      - name: Run tests
        run: python -m pytest tests/ -x --tb=short
      - name: Run coverage measurement
        run: |
          coverage run -m pytest tests/ -x --tb=short
          coverage report --fail-under=65 --skip-covered
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage*

  docker-build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
